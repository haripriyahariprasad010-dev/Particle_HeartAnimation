<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shining Heart</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    background: #000;
    overflow: hidden;
}
canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>
<script>

const canvas = document.getElementById("heartCanvas");
const ctx = canvas.getContext("2d");

const totalParticles = 1000;

let width, height, scale;
let particles = [];
let targets = [];
let progress = 0;

function createHeartPoints() {
    targets = [];
    // Fit the heart inside the screen
    scale = Math.min( width * 0.72 / 32,height * 0.50 / 22);
    const centerX = width / 2;
    const centerY = height / 2;
    for (let i = 0; i < totalParticles; i++) {
        // Trace left lobe, bottom tip, right lobe,
        // and return to the top.
        const t = Math.PI * 2 - (i / totalParticles) * Math.PI * 2;
        // maths calculation for forming heart shape
        const heartX = 16 * Math.pow(Math.sin(t), 3);
        const heartY =
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);
        targets.push({
            x: centerX + heartX * scale,
            y: centerY - heartY * scale
        });
    }
}
class Particle {
    constructor(target, index) {
        this.targetX = target.x;
        this.targetY = target.y;
        this.x = target.x + (Math.random() - 0.5) * 140;
        this.y = target.y + (Math.random() - 0.5) * 140;
        this.size = Math.random() * 1.5 + 0.7;
        this.alpha = Math.random() * 0.5 + 0.5;
        this.twinkle = Math.random() * Math.PI * 2;
        this.speed = Math.random() * 0.035 + 0.045;
        this.index = index;
    }
    update() {
        this.x += (this.targetX - this.x) * this.speed;
        this.y += (this.targetY - this.y) * this.speed;
        this.twinkle += 0.035;
    }
    draw() {
        const glow = 0.55 + 0.45 * Math.sin(this.twinkle);

        ctx.globalAlpha = this.alpha * glow;
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "#ffffff";
        ctx.shadowBlur = 5 + glow * 10;

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2 );
        ctx.fill();
        // Add a little cross-shaped sparkle
        if (glow > 0.9 && this.size > 1.4) {
            ctx.globalAlpha = glow * this.alpha;
            ctx.shadowBlur = 12;

            ctx.fillRect( this.x - 3,this.y - 0.4, 6, 0.8);

            ctx.fillRect(
                this.x - 0.4,
                this.y - 3, 0.8, 6);
        }
    }
}
function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    createHeartPoints();
    particles = [];
    progress = 0;
}
function animate() {
    ctx.clearRect(0, 0, width, height);
    for (let i = 0; i < 3 && progress < totalParticles; i++) { //follows the outline
        particles.push(
            new Particle(targets[progress], progress)
        );
        progress++;
    }
    ctx.save();
    for (const particle of particles) {
        particle.update();
        particle.draw();
    }
    ctx.restore();
    // Reset drawing effects for the next frame
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    requestAnimationFrame(animate);
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();
animate();
</script>
</body>
</html>
